name: Verificação do projeto
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository
      - run: pnpm build:desktop
      - run: pnpm build:collector
      - run: pnpm test:all
      - run: pnpm test:routes:runtime
      - run: pnpm exec wrangler deploy --dry-run --outdir private-data/photo-runtime
      - run: node tests/photo-wasm-runtime.cjs private-data/photo-runtime private-data/photo-runtime-result.json
      - run: pnpm test:panel-performance
      - run: pnpm check:docs
      - run: pnpm docs:txt
      - run: git diff --exit-code -- docs/07-operacao/TRANSFERENCIA_E_MIGRACAO.txt
      - run: pnpm docs:schema
      - run: pnpm docs:code
      - run: git diff --exit-code -- docs/07-operacao/gerado
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:collection-photos:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:v3:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:review-pending:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:collector-refinement:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:ux:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:identity:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:panel:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:school-registration:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:catalogue:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:equipment:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:monitoring:browser
        env:

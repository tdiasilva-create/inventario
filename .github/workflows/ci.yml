name: Verificação do projeto
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository
      - run: pnpm test
      - run: pnpm build:desktop
      - run: pnpm build:collector
      - run: pnpm check:docs
      - run: pnpm docs:txt
      - run: git diff --exit-code -- docs/07-operacao/TRANSFERENCIA_E_MIGRACAO.txt
      - run: pnpm docs:schema
      - run: git diff --exit-code -- docs/07-operacao/gerado
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:v3:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:ux:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:identity:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:panel:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:catalogue:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:equipment:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:monitoring:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:operations:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:panel-navigation:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:photo-performance:browser
        env:
          SEMED_TEST_BROWSER: chromium

      - run: pnpm test:thumbnails:browser
        env:
          SEMED_TEST_BROWSER: chromium

      - run: pnpm test:blocks:browser
        env:
          SEMED_TEST_BROWSER: chromium
      - run: pnpm test:auth:browser
        env:
          SEMED_TEST_BROWSER: chromium

      - run: pnpm test:environment-edit:browser
        env:
          SEMED_TEST_BROWSER: chromium

      - run: pnpm test:equipment-edit:browser
        env:
          SEMED_TEST_BROWSER: chromium
